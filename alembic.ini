[alembic]
script_location = migrations
prepend_sys_path = src
# URL is read from MES_DATABASE_URL in migrations/env.py; this is a fallback.
sqlalchemy.url = postgresql+asyncpg://mes:mes@localhost:5432/mes

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
